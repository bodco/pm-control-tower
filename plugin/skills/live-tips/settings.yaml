# live-tips: personal settings. Everything user- or machine-specific lives here.
# Sharing the skill: a colleague edits only this file (and installs live-transcriber).

user:
  me_label: "Я"                  # how the PM's own mic lines are labelled in the transcript
  them_label: "Співрозмовник"    # label for everyone else (system audio)
  tips_language: uk              # language of the chat wrap-up; tip gists follow the window language (ui_lang, default en) unless the call is in Ukrainian
  name_aliases: []               # how people call you on calls, e.g. [Mike, Michael, Mikey]: "your turn" trigger, instant cards, Whisper prompt
  timezone: Europe/Kiev          # fallback only: live-transcriber reports the Mac zone itself (Notion accepts Europe/Kiev)

start:
  mode: window                   # window = start recording at once with defaults (audience and type auto), correct them in the gear menu of the tips window; chat = ask them in chat first
  ask: true                      # chat mode only: true = ask the call language and the microphone; false = use the defaults

audio:
  mic: default                   # default = the Mac's current input (AirPods, Jabra, ...); mac_mic = always the Mac's own microphone

workspaces: {}                   # optional: general calls about several projects, listed FIRST in the project question
#  company:
#    title: "Company workspace"
#    project_root: ~~home-folder/work/PM/Company
#    projects: [acme-portal, orbit]
#    kind: internal

project_roots: {}                # optional: live recording folder per project slug (overrides the project config)
#  acme-portal: ~~home-folder/work/Acme Portal

hiring:
  coach:                         # optional: calls where you are the one being asked (role "Coach (me)"); the old key "candidate" is still read
    root: ~~home-folder/work/PM/Coach    # recordings of calls without a project go to <root>/live
    workspace: ""                # Workspaces DB page of your personal area: Coach calls without a project are filed there
    facts_doc: ""                # Knowledge Base doc with your talking points (key messages, numbers, results, prepared answers): the only source of facts about you
    notes_folder: ""             # optional local folder with prep notes, e.g. ~~home-folder/work/PM/Coach/notes

paths:
  work_root: ~~home-folder/work                          # Mac folder connected to Cowork
  tool_root: ~~home-folder/work/Tools/live-transcriber
  # Inside device_bash the work_root is mounted as $HOME/mnt/<basename of work_root>

languages:
  # The PM's own mic language is FIXED per call (better accuracy than auto-detect).
  internal:                      # calls with our own team
    me_lang: uk                  # main language of your mic
    me_langs: [uk, en]           # languages YOU may switch to on the call ("say it in English")
    langs: [uk, en]              # everything that may be spoken on the call (first = main; no ru on purpose)
  client:                        # client calls: defaults when the project has no override
    me_lang: from_project        # = client_language of the project config
    me_langs: [from_project]     # add your own language if you may switch to it
    langs: [from_project]
  per_project:                   # overrides by project slug and call kind
    acme-portal:                 # example: an English-speaking client whose team talks Spanish between themselves
      client: {me_lang: en, langs: [en, es]}

tips:
  output: window                 # window | both | chat
  active_rate_seconds: 45        # min gap between non-red tips that do not answer the live topic
  rate_seconds: 90               # same, only when active_mode is false
  proactive: off                 # comment moments and initiative tips (references/proactive.md); also in the window menu
  comment_rate_seconds: 60       # proactive tips only; the window menu overrides it
  late_after_s: 6                # read_delta marks a tip late if the PM already started answering
  research: {enabled: true, max_jobs: 6, max_running: 2}   # background research team (references/research.md)
  answer_check: true             # judge the PM's own answers (client and boss calls; silent on team calls)
  side_talk_summary: true        # summarise when others switch to another language
  idle_stop_minutes: 6           # no new lines this long -> offer to stop
  hard_cap_minutes: 120

model_hint: >
  Pick the session model before "live tips". Everyday calls: Sonnet class (Sonnet 5.5),
  low or medium effort: fast enough for the loop, good judgement for the answer check.
  Interviews, escalations, steering and other high-stakes calls: Opus class (Opus 5.5)
  if a tip delay of 10-30 s is fine. Not Haiku class: too shallow for the answer check
  and multilingual nuance.
